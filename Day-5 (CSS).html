    <body>
        <!--BOX MODEL-->
        <h6> Hey this is am example with respect to Box Model</h6>

        <!--DISPLAY IN CSS-->
        <!--
            >> block
            >> inline
            >> inline-block
        -->

        <!-- Bolck: It will take entire width of ur screen-->
         <div>
            <div class="displayInCss1"> Segment 1 </div>
            <div class="displayInCss2"> Segment 2 </div>
         </div>

         <!--Inline: It will take what space is required-->
         <div>
            <div class="displayInCss1"> Segment 1 </div>
            <div class="displayInCss2"> Segment 2 </div>
         </div>

         <!-- Incline-block-->
         <div>
            <div class="displayInCss1"> Segment 1 </div>
            <div class="displayInCss2"> Segment 2 </div>
         </div>

         <!-- Position in Css-->

         <!--
             >> static (default)
             >> relative
             >> absolute
             >> fixed
             >> sticky
         -->

            offset: top, right, bottom, left
        -->
