    <body>
        <h4> FlexBox </h4>
        <!-- 
           FlexBox:
               >> These are mainly used for creating layouts.
               >> These are 1D layouts (it can be either row or column)
        -->

        <!-- 
            >> Horizontal (X-axis): justify-content
            >> Vertical (Y-axis): allign-items
            >> gap: 10px
            >> flex-direction: row/column
            >> flex-wrap: wrap (dynamic feature)
        -->

        <!-- 
            NOTE:
                Even if div has block scope when it is wrapped within 
                display: flex it will not act as block scope
        -->

        <div class="parent">
            <div class="child">1</div>
            <div class="child">2</div>
            <div class="child">3</div>
            <div class="child">4</div>
            <div class="child">5</div>
            <div class="child">6</div>
            <div class="child">7</div>
            <div class="child">8</div>
            <div class="child">9</div>
            <div class="child">10</div>
            <div class="child">11</div>
            <div class="child">12</div>
            <div class="child">13</div>
        </div>
